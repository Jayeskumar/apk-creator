<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f6f8;color:#222;text-align:center}
    .box{padding:32px;max-width:320px}
    svg{width:72px;height:72px;fill:#9aa3b2}
    h1{font-size:20px;margin:16px 0 8px}
    p{color:#667;margin:0 0 24px;line-height:1.5}
    button{border:0;border-radius:24px;padding:12px 28px;font-size:16px;background:#1e63e9;color:#fff}
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="window.ApkBridge ? ApkBridge.retry() : history.back()">Retry</button>
  </div>
</body>
</html>
